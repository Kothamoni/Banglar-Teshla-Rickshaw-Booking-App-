<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banglar Tesla - Ride Smart</title>

<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  overflow: hidden;
  height: 100vh;
  font-family: 'Ubuntu', sans-serif;
  background: linear-gradient(to bottom, #87CEEB 0%, #e0f7fa 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

/* Title */
.hero-text {
  position: absolute;
  top: 20%;
  text-align: center;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
}

.hero-text h1 {
  font-size: 48px;
  margin: 0;
  color: #222;
}

.hero-text p {
  font-size: 18px;
  color: #555;
  margin-top: 10px;
}

/* Road */
#road {
  position: absolute;
  bottom: 15%;
  width: 100%;
  height: 80px;
  background: #444;
  box-shadow: inset 0 10px 20px rgba(0, 0, 0, 0.4);
}

/* Road lines animation */
#road::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 200%;
  height: 6px;
  background: repeating-linear-gradient(
    to right,
    white 0px,
    white 40px,
    transparent 40px,
    transparent 80px
  );
  animation: roadMove 1s linear infinite;
}
#moving-img {
  background: transparent;
  mix-blend-mode: multiply;
}
/* Moving Rickshaw */
#moving-img {
  position: absolute;
  bottom: 20%;
  width: 250px;
  animation: moveLeftToRight 5s ease-in-out forwards;
}

/* Animations */
@keyframes moveLeftToRight {
  0% { transform: translateX(-300px); }
  100% { transform: translateX(100vw); }
}

@keyframes roadMove {
  from { transform: translateX(0); }
  to { transform: translateX(-80px); }
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* Loader fade out effect */
.fade-out {
  animation: fadeOut 1s forwards;
}

@keyframes fadeOut {
  to { opacity: 0; visibility: hidden; }
}

</style>
</head>
<body>

<div class="hero-text">
  <h1>Banglar Tesla</h1>
  <p>Smart. Sustainable. Seamless Ride Booking.</p>
</div>

<div id="road"></div>

<div class="vehicle-container">
  <img id="moving-img" src="image/rickIconLanding.png" alt="Rickshaw">
</div>

<script>
window.onload = function () {
  setTimeout(function () {
    document.body.classList.add("fade-out");
  }, 4500);

  setTimeout(function () {
    window.location.href = "homeMain.html";
  }, 5500);
};
</script>

</body>
</html>
