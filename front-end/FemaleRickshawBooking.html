<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animated dots for loading */
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            margin: 0 3px;
            background-color: #4235cd;
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body class="bg-gradient-to-r from-purple-400 via-blue-300 to-purple-200 flex items-center justify-center h-screen font-sans">

    <div class="text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-gray-800 mb-6">Will be Loaded Soon</h1>
        <div class="flex justify-center mt-4">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        <p class="mt-4 text-gray-700 text-lg">Please wait while we prepare everything for you...</p>
    </div>

</body>
</html>
